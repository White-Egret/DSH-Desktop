[package]
name = "dsh-launcher"
version = "1.3.6"
description = "DSH Desktop - 启动并管理本机全局安装的 DSH Web 服务"
authors = ["DSH Desktop"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" feature：启用多 Webview API（Window::add_child / Manager::get_webview），
# Tauri v2 官方 multiwebview 示例同样要求此 feature，属于官方支持的用法
# "tray-icon" feature：启用系统托盘 API（TrayIconBuilder / TrayIconEvent）
# 版本下限 >=2.11.1：CVE-2026-42184 / GHSA-7gmj-67g7-phm9（CVSS 8.8）修复版本，
# 防止锁文件重新生成时回退到存在 origin 混淆的旧版本；<3 保留原 "2" 主版本约束
tauri = { version = ">=2.11.1, <3", features = ["unstable", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
# 窗口布局记忆（大小 / 位置 / 最大化）：官方插件。
# 选它的关键理由在恢复侧：它遍历 available_monitors()，只在某个显示器与「保存的位置 +
# 尺寸」相交时才套用坐标，因此多显示器拔掉后不会出现「窗口飞到屏幕外」。
# 版本下限 >=2.2.1：`Builder::with_filter`（安全模式下整条关闭记忆就靠它）在该版本引入，
# 低于它无法表达「安全模式不受影响」；<3 保留主版本约束。
# 该插件自 2.0.1 起 MSRV 也是 1.77.2，与本 crate 的 rust-version 一致。
tauri-plugin-window-state = ">=2.2.1, <3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # 安全模式基线重置的归档目录名用**本地时间**戳（GetLocalTime），比 UTC 对用户更直观
    "Win32_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Security",
    # 把「自定义 DSH 安装目录」写进用户 PATH 之后，用 SendMessageTimeoutW 广播
    # WM_SETTINGCHANGE（见 process::win::broadcast_environment_change）；没有这一广播，
    # 用户新开的终端要等重新登录才认这个目录。
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
